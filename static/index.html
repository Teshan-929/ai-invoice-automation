<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Processing</title>
<style>
  :root { --ink:#1b2430; --muted:#5d6b7c; --line:#dde3ea; --bg:#f5f7fa; --brand:#1f3a5f;
          --ok:#1f7a45; --okbg:#e3f4e8; --bad:#a32525; --badbg:#fde2e2; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px; }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:28px; text-align:center; color:var(--muted); }
  .drop.over { border-color: var(--brand); background:#eef3fa; }
  button, .btn { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:10px 16px;
                 font-size:.95rem; cursor:pointer; text-decoration:none; display:inline-block; }
  button:disabled { opacity:.5; cursor:default; }
  .btn.alt { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  select { padding:9px; border:1px solid var(--line); border-radius:8px; font-size:.95rem; }
  #msg { margin-top:12px; min-height:1.2em; }
  .err { color: var(--bad); }
  .scroll { overflow-x:auto; }
  table { border-collapse: collapse; width:100%; font-size:.92rem; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; }
  td.num, th.num { text-align:right; }
  td.issues { white-space:normal; min-width:200px; color:var(--bad); }
  .badge { padding:3px 9px; border-radius:99px; font-size:.8rem; font-weight:600; }
  .verified { background:var(--okbg); color:var(--ok); }
  .needs_review { background:var(--badbg); color:var(--bad); }
  .empty { color:var(--muted); padding:16px 0; }
</style>
</head>
<body>
<main>
  <h1>Invoice Processing</h1>
  <p class="sub">Upload an invoice (PDF, PNG or JPG). The system reads it, checks the numbers and saves it.</p>

  <section class="card">
    <div class="drop" id="drop">
      <p>Drag files here, or choose them</p>
      <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg" multiple>
    </div>
    <div class="row">
      <button id="go">Process invoices</button>
    </div>
    <div id="msg" role="status"></div>
  </section>

  <section class="card">
    <div class="row" style="margin-top:0; justify-content:space-between">
      <label>Show:
        <select id="filter">
          <option value="">All invoices</option>
          <option value="verified">Verified</option>
          <option value="needs_review">Needs review</option>
        </select>
      </label>
      <a class="btn alt" href="/report/excel">Download Excel report</a>
    </div>
    <div class="scroll"><table id="tbl"></table></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const cols = [["file","File"],["invoice_number","Invoice No"],["date","Date"],
  ["subtotal","Subtotal",1],["tax","Tax",1],["total","Total",1],["status","Status"],["issues","Issues"]];
const fmt = n => n == null ? "" : Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});

function cell(tag, text, cls) {
  const el = document.createElement(tag);
  el.textContent = text ?? "";           // textContent keeps uploaded text from running as HTML
  if (cls) el.className = cls;
  return el;
}

async function loadTable() {
  const status = $("filter").value;
  const res = await fetch("/invoices" + (status ? "?status=" + status : ""));
  const rows = await res.json();
  const tbl = $("tbl");
  tbl.replaceChildren();
  if (!rows.length) { const p = cell("p", "No invoices yet.", "empty"); tbl.append(p); return; }
  const head = document.createElement("tr");
  cols.forEach(([, label, num]) => head.append(cell("th", label, num ? "num" : "")));
  tbl.append(head);
  rows.forEach(r => {
    const tr = document.createElement("tr");
    cols.forEach(([key, , num]) => {
      if (key === "status") {
        const td = document.createElement("td");
        td.append(cell("span", r.status === "verified" ? "Verified" : "Needs review", "badge " + r.status));
        tr.append(td);
      } else if (key === "issues") {
        tr.append(cell("td", r.issues, "issues"));
      } else {
        tr.append(cell("td", num ? fmt(r[key]) : r[key], num ? "num" : ""));
      }
    });
    tbl.append(tr);
  });
}

async function processFiles() {
  const files = [...$("file").files];
  const msg = $("msg");
  msg.className = "";
  if (!files.length) { msg.textContent = "Choose at least one file first."; return; }
  $("go").disabled = true;
  let done = 0, failed = [];
  for (const f of files) {
    msg.textContent = `Processing ${done + failed.length + 1} of ${files.length}: ${f.name}`;
    const body = new FormData(); body.append("file", f);
    try {
      const res = await fetch("/process-invoice", {method:"POST", body});
      if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
      done++;
    } catch (e) { failed.push(f.name + " (" + e.message + ")"); }
  }
  $("go").disabled = false;
  $("file").value = "";
  msg.textContent = `Done: ${done} processed.` + (failed.length ? " Failed: " + failed.join(", ") : "");
  if (failed.length) msg.className = "err";
  loadTable();
}

$("go").addEventListener("click", processFiles);
$("filter").addEventListener("change", loadTable);
const drop = $("drop");
["dragenter","dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => { $("file").files = ev.dataTransfer.files; });
loadTable();
</script>
</body>
</html>
